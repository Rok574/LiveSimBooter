# Save as .github/workflows/build-runtime.yml in YOUR fork of LiveSimBooter.
#
# Two jobs:
#   1. ipa      - builds an UNSIGNED LiveSimBooter.ipa (with file sharing turned on so the app shows in Files).
#                 Sideload/re-sign it yourself. No secrets needed.
#   2. runtime  - (optional) builds the signed RuntimeRoot from the iOS 26.0 simulator runtime (build 23A343).
#                 GitHub's runners do NOT carry 23A343, so you must give it download URL(s) for Apple's runtime .dmg.
#
# Secrets for the runtime job: SIGNING_P12_BASE64, SIGNING_P12_PASSWORD.

name: Build LiveSimBooter

on:
  workflow_dispatch:
    inputs:
      build_runtime:
        description: "Also build the signed runtime (needs runtime_urls + secrets)"
        type: boolean
        default: false
      team_id:
        description: "Apple Team ID (runtime job)"
        default: "9WGVT3PY3P"
      bundle_id:
        description: "Resigned bundle ID (runtime job)"
        default: "com.kdt.LiveSimBooter.9WGVT3PY3P"
      runtime_urls:
        description: "Space-separated direct URL(s) of the iOS 26.0 (23A343) simulator runtime .dmg, in order if split"
        default: ""

env:
  LSB_WORK: ${{ github.workspace }}/tmp/setup-26.0
  EXPECTED_RUNTIME_BUILD: "23A343"
  FISH_VERSION: "4.9.3"
  FISH_SHA256: "20998a25f73217ddcc19f499055fd587e9912d1ad6e7109120fbcf2871f0b98c"

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------ IPA
  ipa:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build unsigned app
        run: |
          set -e
          xcodebuild -version
          xcodebuild -project LiveSimBooter.xcodeproj -scheme LiveSimBooter -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          APP="build/Build/Products/Release-iphoneos/LiveSimBooter.app"
          test -d "$APP" || { echo "::error::App not found"; find build -name '*.app' -maxdepth 5; exit 1; }
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Turn on file sharing (shows app in Files app)
        run: |
          set -e
          PL="$APP/Info.plist"
          for key in UIFileSharingEnabled LSSupportsOpeningDocumentsInPlace; do
            /usr/libexec/PlistBuddy -c "Delete :$key" "$PL" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :$key bool true" "$PL"
          done
          plutil -p "$PL" | head -40

      - name: Package IPA
        run: |
          set -e
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../LiveSimBooter-unsigned.ipa Payload)
          ls -lh LiveSimBooter-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: LiveSimBooter-unsigned-ipa
          path: LiveSimBooter-unsigned.ipa

  # -------------------------------------------------------------- RUNTIME
  runtime:
    if: ${{ inputs.build_runtime }}
    runs-on: macos-26
    timeout-minutes: 360
    env:
      LSB_TEAM: ${{ inputs.team_id }}
      LSB_BUNDLE_ID: ${{ inputs.bundle_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Show environment
        run: |
          df -h /
          xcodebuild -version
          mkdir -p "$LSB_WORK"

      - name: Obtain iOS 26.0 simulator runtime (23A343)
        env:
          RUNTIME_URLS: ${{ inputs.runtime_urls }}
        run: |
          find_rt() {
            find /Library/Developer/CoreSimulator -maxdepth 8 -name '*.simruntime' 2>/dev/null | while IFS= read -r rt; do
              b="$(/usr/libexec/PlistBuddy -c 'Print :ProductBuildVersion' "$rt/Contents/Resources/RuntimeRoot/System/Library/CoreServices/SystemVersion.plist" 2>/dev/null || true)"
              echo "found $rt -> $b" >&2
              if [ "$b" = "$EXPECTED_RUNTIME_BUILD" ]; then echo "$rt"; break; fi
            done
          }
          RT="$(find_rt)"
          if [ -z "$RT" ] && [ -n "$RUNTIME_URLS" ]; then
            echo "== Downloading runtime from provided URL(s) =="
            DL="$RUNNER_TEMP/rtdl"; mkdir -p "$DL"
            : > "$DL/runtime.bin"
            for u in $RUNTIME_URLS; do
              curl -fL --retry 3 "$u" >> "$DL/runtime.bin"
            done
            ls -lh "$DL/runtime.bin"
            file "$DL/runtime.bin" || true
            DMG=""
            case "$RUNTIME_URLS" in
              *.aar*|*.aar)
                # Apple Archive (MobileAsset): unpack, then look for the disk image inside
                mv "$DL/runtime.bin" "$DL/runtime.aar"
                mkdir -p "$DL/x"
                aa extract -i "$DL/runtime.aar" -d "$DL/x" || yaa extract -i "$DL/runtime.aar" -d "$DL/x"
                find "$DL/x" -maxdepth 6 | head -50
                DMG="$(find "$DL/x" -name '*.dmg' -print -quit)"
                ;;
              *)
                mv "$DL/runtime.bin" "$DL/runtime.dmg"; DMG="$DL/runtime.dmg"
                ;;
            esac
            if [ -n "$DMG" ]; then
              echo "Installing disk image: $DMG"
              sudo xcrun simctl runtime add "$DMG"
              xcrun simctl runtime list || true
              RT="$(find_rt)"
            fi
            if [ -z "$RT" ]; then
              # Some archives contain a ready-made .simruntime or RuntimeRoot tree
              RT="$(find "$DL/x" -name '*.simruntime' -print -quit 2>/dev/null || true)"
              if [ -n "$RT" ]; then
                b="$(/usr/libexec/PlistBuddy -c 'Print :ProductBuildVersion' "$RT/Contents/Resources/RuntimeRoot/System/Library/CoreServices/SystemVersion.plist" 2>/dev/null || true)"
                echo "extracted runtime build: $b"
                [ "$b" = "$EXPECTED_RUNTIME_BUILD" ] || RT=""
              fi
            fi
          fi
          if [ -z "$RT" ]; then
            echo "== Looking up 23A343 in Apple's Xcode download index =="
            cat > "$RUNNER_TEMP/find_runtime.py" <<'PY'
          import gzip, plistlib, sys, urllib.request
          INDEXES = [
              "https://devimages-cdn.apple.com/downloads/xcode/simulators/index2.dvtdownloadableindex",
              "https://devimages-cdn.apple.com/downloads/xcode/simulators/index-26-.dvtdownloadableindex",
          ]
          want = sys.argv[1]
          for url in INDEXES:
              try:
                  raw = urllib.request.urlopen(url, timeout=60).read()
              except Exception as e:
                  print("index failed", url, e, file=sys.stderr); continue
              for data in (raw, None):
                  try:
                      data = data or gzip.decompress(raw)
                      idx = plistlib.loads(data); break
                  except Exception:
                      idx = None
              if not idx:
                  print("could not parse", url, file=sys.stderr); continue
              for d in idx.get("downloadables", []):
                  sv = d.get("simulatorVersion", {}) or {}
                  if want in str(sv.get("buildUpdate", "")) or want in str(d.get("name", "")) or want in str(d.get("source", "")):
                      print(d.get("source")); sys.exit(0)
              print("no", want, "entry in", url, file=sys.stderr)
          sys.exit(1)
          PY
            if SRC="$(python3 "$RUNNER_TEMP/find_runtime.py" "$EXPECTED_RUNTIME_BUILD")" && [ -n "$SRC" ]; then
              echo "Index source: $SRC"
              DL="$RUNNER_TEMP/rtidx"; mkdir -p "$DL"
              if curl -fL --retry 3 -o "$DL/runtime.dmg" "$SRC"; then
                sudo xcrun simctl runtime add "$DL/runtime.dmg" || true
                RT="$(find_rt)"
              else
                echo "Index download failed (Apple may require a signed-in session for this URL)."
              fi
            fi
          fi
          if [ -z "$RT" ]; then
            for X in /Applications/Xcode*.app; do
              sudo xcode-select -s "$X"
              xcodebuild -downloadPlatform iOS -buildVersion 26.0 || xcodebuild -downloadPlatform iOS -buildVersion 26.0.1 || true
              RT="$(find_rt)"; [ -n "$RT" ] && break
            done
          fi
          if [ -z "$RT" ]; then
            echo "::error::Build $EXPECTED_RUNTIME_BUILD not available on this runner. Provide runtime_urls (direct link(s) to Apple's iOS 26.0 simulator runtime .dmg)."
            exit 1
          fi
          echo "Using $RT"
          echo "LSB_RUNTIME_SOURCE=$RT/Contents/Resources/RuntimeRoot" >> "$GITHUB_ENV"

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/lsb.keychain-db"
          KCPW="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC"
          security list-keychains -d user -s "$KC" login.keychain
          ID="$(security find-identity -v -p codesigning "$KC" | awk '/[0-9A-F]{40}/ {print $2; exit}')"
          [ -n "$ID" ] || { echo "::error::No signing identity found in .p12"; exit 1; }
          echo "LSB_SIGNING_IDENTITY=$ID" >> "$GITHUB_ENV"

      - name: Build, patch and sign the dyld shared cache
        run: |
          set -e
          python3 Tools/setup-ios26-cache.py --runtime-root "$LSB_RUNTIME_SOURCE" --validate-only > "$LSB_WORK/cache-preflight.json"
          python3 Tools/setup-ios26-cache.py --runtime-root "$LSB_RUNTIME_SOURCE" --output-dir "$LSB_WORK/cache" > "$LSB_WORK/cache-result.json"
          mkdir -p "$LSB_WORK/patched-cache" "$LSB_WORK/signed-cache"
          python3 Tools/patch-ios26-container-metadata.py \
            --source "$LSB_WORK/cache/unsigned/dyld_sim_shared_cache_arm64" \
            --output "$LSB_WORK/patched-cache/dyld_sim_shared_cache_arm64" > "$LSB_WORK/cache-metadata-patch.json"
          python3 Tools/patch-ios26-keyboard-haptics.py \
            --source "$LSB_WORK/patched-cache/dyld_sim_shared_cache_arm64" \
            --output "$LSB_WORK/patched-cache/dyld_sim_shared_cache_arm64.haptics" > "$LSB_WORK/cache-haptics-patch.json"
          python3 Tools/sign-dyld-cache.py "$LSB_WORK/patched-cache/dyld_sim_shared_cache_arm64.haptics" \
            "$LSB_WORK/signed-cache/dyld_sim_shared_cache_arm64" \
            --identity "$LSB_SIGNING_IDENTITY" --identifier "$LSB_BUNDLE_ID" --team "$LSB_TEAM" > "$LSB_WORK/cache-signing.json"
          python3 Tools/setup-ios26-cache.py --check-cache "$LSB_WORK/signed-cache/dyld_sim_shared_cache_arm64" > "$LSB_WORK/cache-signed-layout.json"

      - name: Patch loader, launchd and helper; build guest tools
        run: |
          set -e
          python3 Tools/patch-ios26-cache-base.py \
            --builder "$LSB_RUNTIME_SOURCE/../update_dyld_sim_shared_cache" \
            --dyld-sim "$LSB_RUNTIME_SOURCE/usr/lib/dyld_sim" --output-dir "$LSB_WORK/loader-base"
          python3 Tools/patch-ios26-platform.py --source "$LSB_WORK/loader-base/dyld_sim" --output "$LSB_WORK/dyld_sim"
          python3 Tools/patch-ios26-launchd-identity.py --source "$LSB_RUNTIME_SOURCE/sbin/launchd_sim" --output "$LSB_WORK/launchd_sim"
          sh Tools/build-spawn-shim.sh "$LSB_WORK/guest/libLiveSimSpawn.dylib" "$LSB_WORK/guest/spawn-probe"
          sh Tools/build-terminal-fish.sh "$LSB_WORK/guest"
          sh Tools/build-display-settings.sh "$LSB_WORK/guest"
          sh Tools/build-launchctl-control.sh "$LSB_WORK/guest"
          sh Tools/build-app-registration.sh "$LSB_WORK/guest"
          MI_DIR='/System/Library/PrivateFrameworks/MobileInstallation.framework/XPCServices/com.apple.MobileInstallationHelperService.xpc'
          python3 Tools/patch-ios26-container-metadata.py --mach-o \
            --source "$LSB_RUNTIME_SOURCE$MI_DIR/com.apple.MobileInstallationHelperService" \
            --output "$LSB_WORK/MobileInstallationHelperService" > "$LSB_WORK/helper-metadata-patch.json"
          echo "LSB_MI_HELPER=$MI_DIR/com.apple.MobileInstallationHelperService" >> "$GITHUB_ENV"

      - name: Build Fish (arm64 iOS simulator)
        run: |
          set -e
          cd "$LSB_WORK"
          curl -fsSL -o fish.tar.xz "https://github.com/fish-shell/fish-shell/releases/download/${FISH_VERSION}/fish-${FISH_VERSION}.tar.xz"
          echo "${FISH_SHA256}  fish.tar.xz" | shasum -a 256 -c -
          mkdir fish-source && tar -xf fish.tar.xz -C fish-source --strip-components=1
          rustup toolchain install 1.91.1 --profile minimal
          rustup target add aarch64-apple-ios-sim --toolchain 1.91.1
          printf '#!/bin/sh\nexec /usr/bin/xcrun --sdk iphonesimulator clang -target arm64-apple-ios26.0-simulator "$@"\n' > simulator-clang.sh
          chmod +x simulator-clang.sh
          CARGO_TARGET_DIR="$LSB_WORK/fish-target" \
          CARGO_TARGET_AARCH64_APPLE_IOS_SIM_LINKER="$LSB_WORK/simulator-clang.sh" \
          CC_aarch64_apple_ios_sim="$LSB_WORK/simulator-clang.sh" \
          CARGO_PROFILE_RELEASE_LTO=false CARGO_PROFILE_RELEASE_DEBUG=1 \
          IPHONEOS_DEPLOYMENT_TARGET=26.0 PCRE2_SYS_STATIC=1 PREFIX=/usr \
          cargo +1.91.1 build --locked --release --no-default-features --target aarch64-apple-ios-sim \
            --manifest-path "$LSB_WORK/fish-source/Cargo.toml" --bin fish
          echo "LSB_FISH=$LSB_WORK/fish-target/aarch64-apple-ios-sim/release/fish" >> "$GITHUB_ENV"

      - name: Write guest job plists helper
        run: |
          cat > "$LSB_WORK/make-jobs.py" <<'PY'
          import pathlib, plistlib, sys
          root = pathlib.Path(sys.argv[1])
          jobs = [
              ('System/Library/LaunchDaemons/com.kdt.LiveSimBooter.launchctl-control.plist',
               'com.kdt.LiveSimBooter.launchctl-control', ['/usr/libexec/launchctl-control']),
              ('usr/share/LiveSimBooter/app-registration.plist', 'com.kdt.LiveSimBooter.app-registration',
               ['/usr/libexec/app-registration', '--manifest', '/usr/share/LiveSimBooter/applications.json']),
          ]
          for relative, label, arguments in jobs:
              path = root / relative
              path.parent.mkdir(parents=True, exist_ok=True)
              job = dict(Label=label, ProgramArguments=arguments, WorkingDirectory='/private/var/mobile/',
                         RunAtLoad=True, KeepAlive=False,
                         StandardOutPath='/private/var/mobile/Library/Logs/' + label + '.log',
                         StandardErrorPath='/private/var/mobile/Library/Logs/' + label + '.log')
              with path.open('xb') as output:
                  plistlib.dump(job, output)
          PY
          sed -i '' 's/^          //' "$LSB_WORK/make-jobs.py"

      - name: Stage and sign the full RuntimeRoot
        run: |
          set -e
          CORESIM="/Library/Developer/PrivateFrameworks/CoreSimulator.framework/Versions/A/Resources/Platforms/iphoneos"
          FB="$CORESIM/Library/PrivateFrameworks/SimFramebuffer.framework"
          HID="$CORESIM/Library/Frameworks/SimulatorHID.framework"
          CAPS="/Library/Developer/CoreSimulator/Profiles/DeviceTypes/iPhone 15 Pro Max.simdevicetype/Contents/Resources/capabilities.plist"
          SCOPES="--scope Applications --scope System/Applications --scope System/Library --scope System/Cryptexes --scope Library --scope usr --scope bin --scope sbin --scope private/etc --scope etc --scope Developer --scope RestoreVersion.plist"
          python3 Tools/setup-ios26-runtime.py --runtime-root "$LSB_RUNTIME_SOURCE" \
            --cache-manifest Tools/setup-ios26-cache-inputs.json --stage --output-dir "$LSB_WORK/runtime" \
            $SCOPES --allow-missing-dependencies \
            --identity "$LSB_SIGNING_IDENTITY" --identifier "$LSB_BUNDLE_ID" --capabilities "$CAPS" \
            --add-binary "/usr/lib/dyld_sim=$LSB_WORK/dyld_sim" \
            --add-binary "/sbin/launchd_sim=$LSB_WORK/launchd_sim" \
            --add-binary "/usr/lib/libLiveSimSpawn.dylib=$LSB_WORK/guest/libLiveSimSpawn.dylib" \
            --add-binary "/bin/spawn-probe=$LSB_WORK/guest/spawn-probe" \
            --add-binary "/usr/libexec/terminal-fish=$LSB_WORK/guest/terminal-fish" \
            --add-binary "/usr/libexec/display-settings=$LSB_WORK/guest/display-settings" \
            --add-binary "/usr/libexec/launchctl-control=$LSB_WORK/guest/launchctl-control" \
            --add-binary "/usr/libexec/app-registration=$LSB_WORK/guest/app-registration" \
            --add-binary "$LSB_MI_HELPER=$LSB_WORK/MobileInstallationHelperService" \
            --add-binary "/bin/fish=$LSB_FISH" \
            --add-binary "/Library/PrivateFrameworks/SimFramebuffer.framework/SimFramebuffer=$FB/SimFramebuffer" \
            --add-binary "/Library/Frameworks/SimulatorHID.framework/SimulatorHID=$HID/SimulatorHID" \
            > "$LSB_WORK/runtime-stage.json" 2> "$LSB_WORK/runtime-stage.log"
          RR="$LSB_WORK/runtime/RuntimeRoot"
          cp "$FB/Info.plist"  "$RR/Library/PrivateFrameworks/SimFramebuffer.framework/Info.plist"
          cp "$HID/Info.plist" "$RR/Library/Frameworks/SimulatorHID.framework/Info.plist"
          mkdir -p "$RR/System/Library/Caches/com.apple.dyld"
          cp "$LSB_WORK/signed-cache/dyld_sim_shared_cache_arm64" "$RR/System/Library/Caches/com.apple.dyld/dyld_sim_shared_cache_arm64"
          python3 Tools/setup-ios26-device-types.py --device-types-root /Library/Developer/CoreSimulator/Profiles/DeviceTypes \
            --output-dir "$LSB_WORK/device-types"
          ditto "$LSB_WORK/device-types/RuntimeRoot/Library/Developer/CoreSimulator/DeviceTypes" \
            "$RR/Library/Developer/CoreSimulator/DeviceTypes"
          python3 "$LSB_WORK/make-jobs.py" "$RR"
          df -h /

      - name: Package RuntimeRoot into 1.9 GB parts
        run: |
          set -e
          mkdir -p "$LSB_WORK/out"
          cd "$LSB_WORK/runtime"
          tar -cf - RuntimeRoot | split -b 1900m -a 3 - "$LSB_WORK/out/RuntimeRoot.tar.part"
          cp "$LSB_WORK"/*.json "$LSB_WORK/out/" 2>/dev/null || true
          cp "$LSB_WORK/runtime/stage-manifest.json" "$LSB_WORK/out/" 2>/dev/null || true
          cd "$LSB_WORK/out" && shasum -a 256 * > SHA256SUMS.txt
          ls -lh

      - name: Publish as a draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="runtime-23A343-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --title "Runtime 23A343 (run ${GITHUB_RUN_NUMBER})" \
            --notes "Re-join with: cat RuntimeRoot.tar.part* | tar -xf -" --draft
          for f in "$LSB_WORK"/out/*; do gh release upload "$TAG" "$f" --clobber; done
